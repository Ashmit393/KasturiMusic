name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kasturi-release.jks"
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/kasturi-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/Alias name:/{print $2; exit}')"
          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: Keystore alias detect nahi hua."
            exit 1
          fi
          export KEY_ALIAS
          export KEY_PASSWORD="$KEYSTORE_PASSWORD"
          echo "Release signing configured."
          gradle assembleRelease --no-daemon
      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            find app/build/outputs -type f -print
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" KasturiMusic.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kasturi-music-release-apk
          path: KasturiMusic.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release delete "v$VER" --cleanup-tag -y || true
          gh release create "v$VER" KasturiMusic.apk --title "KASTURI MUSIC PLAYER v$VER" --notes "Made with love by Ashmit Singh" --latest
